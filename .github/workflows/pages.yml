name: Pages

# Publishes the documentation site to GitHub Pages (https://yelison.github.io/forma-ui/) on every push to main.
# Requires Settings > Pages > Source: "GitHub Actions". The checks live in ci.yml: this workflow only builds and ships.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A deployment in progress is allowed to finish: cancelling it halfway could leave the site half published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: npm ci
      # The site resolves @yelison/forma-ui through its exports map, which points at dist/: the build does the library
      # first and then the site, with one index.html for each route and a 404.html next to them.
      - run: npm run build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write # publish the artifact to Pages
      id-token: write # prove to Pages that the deployment comes from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
