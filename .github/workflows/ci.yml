name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The job names below are the required checks: scripts/herdr/project.env (HERDR_REQUIRED_CHECKS) and the
# branch protection rules list exactly the same names. Renaming a job means changing all of them together.
jobs:
  library:
    name: Library
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The generated files that are committed (src/tokens/tokens.ts, src/components/Icon/paths.ts) must match what
      # the generators write now.
      - run: npm run build:tokens -w @yelison/forma-ui
      - run: npm run build:icons -w @yelison/forma-ui
      - run: git diff --exit-code
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck -w @yelison/forma-ui
      # The same tests as `npm test`, plus the coverage thresholds: running both would repeat the suite.
      - run: npm run test:coverage -w @yelison/forma-ui
      # The full build comes before the browser specs, which load the built dist/tokens.css and dist/styles.css.
      - run: npm run build -w @yelison/forma-ui
      # Every file that `exports` promises must be in dist/: a build step that stops emitting one still exits 0.
      - run: |
          node -e "
          const targets = (value) => (typeof value === 'string' ? [value] : Object.values(value).flatMap(targets))
          const missing = targets(require('./package.json').exports).filter((path) => !require('node:fs').existsSync(path))
          if (missing.length) { console.error('Missing export targets: ' + missing.join(', ')); process.exit(1) }
          console.log('Export targets present: ' + targets(require('./package.json').exports).length)
          "
        working-directory: packages/forma-ui
      # The built package as a consumer receives it: nodenext compile, CSS exports and the rules behind the classes.
      - run: npm run check:consumer -w @yelison/forma-ui
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser

  site:
    name: Site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The site resolves @yelison/forma-ui through its exports map, which points at dist/: build the library first.
      - run: npm run build -w @yelison/forma-ui
      - run: npm run typecheck -w forma-ui-site
      # es.json must have the keys, the ICU syntax and the arguments of en.json.
      - run: npm run check:messages -w forma-ui-site
      - run: npm test -w forma-ui-site
      - run: npm run build -w forma-ui-site

  site-e2e:
    name: Site e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # The Playwright web server builds the library and the site before serving them.
      - run: npm run e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-traces
          path: site/test-results
          retention-days: 7
