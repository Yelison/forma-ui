name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The job names below are the required checks: scripts/herdr/project.env (HERDR_REQUIRED_CHECKS) and the
# branch protection rules list exactly the same names. Renaming a job means changing all of them together.
jobs:
  library:
    name: Library
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck -w @yelison/forma-ui
      - run: npm test -w @yelison/forma-ui
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run build -w @yelison/forma-ui

  site:
    name: Site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The site resolves @yelison/forma-ui through its exports map, which points at dist/: build the library first.
      - run: npm run build -w @yelison/forma-ui
      - run: npm run typecheck -w forma-ui-site
      - run: npm test -w forma-ui-site
      - run: npm run build -w forma-ui-site

  site-e2e:
    name: Site e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # The Playwright web server builds the library and the site before serving them.
      - run: npm run e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-traces
          path: site/test-results
          retention-days: 7
