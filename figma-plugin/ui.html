<!doctype html><html lang="es"><meta charset="utf-8">
<style>body{font:13px system-ui;padding:16px;color:var(--figma-color-text,#17243d);background:var(--figma-color-bg,#fff)}h2{font-size:18px}button{background:#3569f6;color:white;border:0;border-radius:8px;padding:12px;width:100%;cursor:pointer}button:disabled{opacity:.5}p{line-height:1.6}#status{white-space:pre-wrap}</style>
<h2>Forma UI Builder · v0.8</h2><p>Genera la web editorial en la página 07: guía con ejemplos y un historial visual de cambios. Conserva la biblioteca y la página 06. Elimina la antigua página 05 al completar la nueva web.</p>
<button id="update">Actualizar guías y cambios</button>
<p>Para un archivo vacío: <button id="run">Generar base inicial</button></p>
<p id="status" role="status">En tu archivo actual, pulsa Actualizar guías y cambios.</p>
<script>const run=document.getElementById('run'),update=document.getElementById('update'),status=document.getElementById('status');function send(type){run.disabled=update.disabled=true;parent.postMessage({pluginMessage:{type}},'*')};run.onclick=()=>send('build');update.onclick=()=>send('update');onmessage=e=>{const m=e.data.pluginMessage;if(!m)return;status.textContent=m.message;if(m.type==='done'||m.type==='error')run.disabled=update.disabled=false;};</script>
